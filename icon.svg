  <!-- Letras M e D estilizadas -->
  <text x="32" y="42" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="30" 
        fill="#38bdf8" 
        text-anchor="middle">MD</text>
</svg>
